[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workforceiq"
version = "0.1.0"
description = "WorkforceIQ - workforce demand forecasting and skill gap analysis (FastAPI backend and synthetic data generator)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "numpy>=2.1,<3",
    "faker>=30,<40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*", "datagen*"]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette 1.x recommends httpx2 for its TestClient; httpx still works and is pinned.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: uses a real, disposable database (SQLite files under pytest's tmp dir)",
    "postgres: needs a live PostgreSQL server; skipped unless WFIQ_TEST_PG_URL is set",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any is legitimate in SQLAlchemy type/event hooks; mypy --strict still checks
    "N818",    # domain exception names (BusinessRuleViolation, ...) are used in the docs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"migrations/versions/**" = ["E501"]  # generated DDL strings

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "datagen"]
